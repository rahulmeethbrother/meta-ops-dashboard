services:
  - type: web
    name: company-studio-meta-ops
    runtime: node
    rootDir: web
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- -p $PORT
    healthCheckPath: /ads
    plan: free
    envVars:
      - key: NEXT_PUBLIC_FIREBASE_API_KEY
        value: demo-api-key
      - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        value: demo.firebaseapp.com
      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        value: demo-project
      - key: NEXT_PUBLIC_FIREBASE_APP_ID
        value: demo-app-id
      - key: FIREBASE_SERVICE_ACCOUNT_B64
        sync: false
      - key: GCP_PROJECT
        sync: false
      - key: META_MCP_BRIDGE_URL
        sync: false
      - key: META_MCP_BRIDGE_TOKEN
        sync: false
      - key: PIPEBOARD_MCP_URL
        value: https://meta-ads.mcp.pipeboard.co/
      - key: PIPEBOARD_MCP_TOKEN
        sync: false
      - key: META_OPS_PASSWORD
        sync: false
      - key: META_MONITOR_SECRET
        sync: false
      - key: META_OPS_URL
        sync: false
  - type: cron
    name: company-studio-meta-monitor
    runtime: node
    rootDir: web
    schedule: "*/5 * * * *"
    buildCommand: npm ci
    startCommand: node scripts/meta-monitor.mjs
    plan: free
    envVars:
      - key: META_OPS_URL
        fromService:
          type: web
          name: company-studio-meta-ops
          envVarKey: RENDER_EXTERNAL_URL
      - key: META_MONITOR_SECRET
        sync: false
      - key: PIPEBOARD_MCP_TOKEN
        sync: false
