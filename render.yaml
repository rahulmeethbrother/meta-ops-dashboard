services:
  - type: web
    name: company-studio-meta-ops
    runtime: node
    rootDir: web
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- -p $PORT
    healthCheckPath: /ads
    plan: free
    envVars:
      - key: NEXT_PUBLIC_FIREBASE_API_KEY
        value: demo-api-key
      - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        value: demo.firebaseapp.com
      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        value: demo-project
      - key: NEXT_PUBLIC_FIREBASE_APP_ID
        value: demo-app-id
      - key: FIREBASE_SERVICE_ACCOUNT_B64
        sync: false
      - key: GCP_PROJECT
        sync: false
      - key: META_MCP_BRIDGE_URL
        sync: false
      - key: META_MCP_BRIDGE_TOKEN
        sync: false
      - key: PIPEBOARD_MCP_URL
        value: https://meta-ads.mcp.pipeboard.co/
      - key: PIPEBOARD_MCP_TOKEN
        sync: false
